hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer_user
  - _self_

data:
  max_prompt_length: 2000
  max_response_length: 30767
  train_batch_size: 256
  return_raw_chat: True

actor_rollout_ref:
  hybrid_engine: True
  rollout:
    name: vllm
    multi_turn:
      enable: True
      max_assistant_turns: 15
      max_tool_response_length: 1000000
